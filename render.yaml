services:
  - type: web
    name: cityhub
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: MYSQLHOST
        sync: false
      - key: MYSQLPORT
        value: "3306"
      - key: MYSQLDATABASE
        value: "cityhub"
      - key: MYSQLUSER
        sync: false
      - key: MYSQLPASSWORD
        sync: false
